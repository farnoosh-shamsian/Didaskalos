# Two custom palettes rather than one. Defining [theme.light] and [theme.dark]
# is what makes Streamlit offer an appearance choice at all: with a single
# [theme] table the custom theme is the only theme and the switcher is empty.
# Anything declared here is inherited by both, so every colour lives in one of
# the two sections below.
#
# The colours are the project site's own (docs/assets/styles.css), so the app and
# the page it is linked from read as one thing: sand ground and deep red on
# light, the logo's gold on near-black brown for dark. The site's rule about the
# red holds here too — a saturated red is only ever text or a small filled
# surface, and on dark it gives way to the gold entirely.
#
# borderColor is far darker than the ground it draws on, on purpose: it is the
# only thing marking where an input begins, and a hairline tinted to match the
# sand disappears for anyone reading with reduced contrast sensitivity.
[theme]
font = "sans-serif"

[theme.light]
primaryColor = "#3a1712"
backgroundColor = "#cdc6b6"
secondaryBackgroundColor = "#afa795"
textColor = "#1f1c16"
linkColor = "#530707"
borderColor = "#5c5545"
codeBackgroundColor = "#dad4c8"
dataframeHeaderBackgroundColor = "#afa795"

[theme.dark]
primaryColor = "#d4a87a"
backgroundColor = "#181310"
secondaryBackgroundColor = "#362923"
textColor = "#e7ded0"
linkColor = "#e0b68a"
borderColor = "#8e705c"
codeBackgroundColor = "#362923"
dataframeHeaderBackgroundColor = "#362923"

[server]
headless = true
port = 8080
enableCORS = false
# Serves ./static/ at /app/static/. The idle watcher parks timed-out tabs on
# static/session-ended.html, which has to be reachable without opening a
# Streamlit session — that is the whole point of sending them there.
enableStaticServing = true
