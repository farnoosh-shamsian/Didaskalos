steps:
  # Build the container image (Dockerfile lives in the app subdirectory)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/didaskalos-501609/cloud-run-source-deploy/didaskalos-app:latest'
      - '-t'
      - 'europe-west1-docker.pkg.dev/didaskalos-501609/cloud-run-source-deploy/didaskalos-app:$SHORT_SHA'
      - 'didaskalos_streamlit_app'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'europe-west1-docker.pkg.dev/didaskalos-501609/cloud-run-source-deploy/didaskalos-app'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'didaskalos-app'
      - '--image'
      - 'europe-west1-docker.pkg.dev/didaskalos-501609/cloud-run-source-deploy/didaskalos-app:$SHORT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      # Building a textbook loads the whole selected corpus into pandas. A large
      # "select all" run peaks well above the 512Mi default and was being
      # OOM-killed mid-build; 2Gi leaves comfortable headroom. The longer request
      # timeout covers the slowest full-corpus builds.
      #
      # CPU is back to 1: the OOM was a memory problem, the second core only
      # shaved time off builds, and every vCPU is billed for the whole life of an
      # instance — including the long idle stretches an open Streamlit tab causes
      # (its websocket counts as an in-flight request). startup-cpu-boost still
      # covers cold starts. max-instances caps the worst case; at the default
      # concurrency of 80 sessions per instance, 3 is plenty for a demo app and
      # turns an unbounded bill into a bounded one.
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '600'
      - '--max-instances'
      - '3'

images:
  - 'europe-west1-docker.pkg.dev/didaskalos-501609/cloud-run-source-deploy/didaskalos-app:latest'
  - 'europe-west1-docker.pkg.dev/didaskalos-501609/cloud-run-source-deploy/didaskalos-app:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
